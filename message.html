<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a40000" />
    <meta
      name="description"
      content="رعية مار اسطفان - البترون، أخبار الرعية، مواعيد القداديس والحياة الروحية والخدمة الاجتماعية."
    />
    <title>رعية مار اسطفان - الجماعات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      rel="shortcut icon"
      href="images/parish-logo.webp"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/header.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/footers.js" defer></script>
  </head>

  <body>
    <!-- skeleton loading -->
    <div id="pageSkeleton" aria-hidden="true">
      <div class="sk-top"></div>
      <div class="sk-nav"></div>
      <div class="sk-hero skeleton-shimmer"></div>
      <div class="container">
        <div class="sk-line sk-title skeleton-shimmer"></div>
        <div class="sk-line skeleton-shimmer"></div>
        <div class="sk-line skeleton-shimmer"></div>
        <div class="sk-line sk-short skeleton-shimmer"></div>
        <div class="sk-grid">
          <div class="sk-card">
            <div class="sk-media skeleton-shimmer"></div>
            <div class="sk-body">
              <div class="sk-line skeleton-shimmer"></div>
              <div class="sk-line sk-short skeleton-shimmer"></div>
            </div>
          </div>
          <div class="sk-card">
            <div class="sk-media skeleton-shimmer"></div>
            <div class="sk-body">
              <div class="sk-line skeleton-shimmer"></div>
              <div class="sk-line sk-short skeleton-shimmer"></div>
            </div>
          </div>
          <div class="sk-card">
            <div class="sk-media skeleton-shimmer"></div>
            <div class="sk-body">
              <div class="sk-line skeleton-shimmer"></div>
              <div class="sk-line sk-short skeleton-shimmer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="top-strip" aria-hidden="true"></div>

    <!-- header -->
    <header id="header"></header>

    <main>
      <!-- Hero Section -->
      <section class="secondHero churchbackground-left">
        <div class="container">
          <h2>رســالـــة الاحـــد</h2>
        </div>
      </section>

      <!-- History / About Section (Styled like "تاريخنا" from image) -->
      <section class="saint-section" id="about">
        <div class="container">
          <div class="title">
            <h2>رسالة الاحد</h2>
          </div>
          <p>
            رسالة اسبوعية تصدر عن كاتدرائية مار اسطفان بداخلها جميع الاحداث
            والاخبار عن الرعية ونشاطاتها وتوصياتها
          </p>
        </div>
      </section>

      <section class="services-section paperbackground" id="priests">
        <div class="container">
          <div class="risele-group">
            <!-- risele image -->
            <div class="riseleimg">
              <img src="images/1 1.png" alt="risele" />
              <p>1/4</p>
            </div>
            <!-- risele image -->
            <div class="riseleimg">
              <img src="images/1 1.png" alt="risele" />
              <p>2/4</p>
            </div>
            <!-- risele image -->
            <div class="riseleimg">
              <img src="images/1 1.png" alt="risele" />
              <p>3/4</p>
            </div>
            <!-- risele image -->
            <div class="riseleimg">
              <img src="images/1 1.png" alt="risele" />
              <p>4/4</p>
            </div>
          </div>

          <!-- download button -->
          <div class="downloadbtn">
            <button class="read-more">تحميل الرسالة</button>
          </div>
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer id="footer" class="footer"></footer>

    <!-- back to top button -->
    <a class="to-top" href="#header" id="toTop" aria-label="العودة إلى الأعلى"
      ><i class="fa-solid fa-arrow-up"></i
    ></a>
  </body>
</html>
